name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: page_server

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: page_server/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build the static site
        run: pnpm build
