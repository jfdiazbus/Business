# Fallback for Cloudflare's builder.
name = "portfolio"
main = "page_server/worker.js"
compatibility_date = "2026-10-15"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[previews]

[assets]
directory = "./page_server/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
