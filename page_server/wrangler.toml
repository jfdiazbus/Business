# Cloudflare Workers, serving the static build in ./dist.
#
#   pnpm build && pnpm deploy
#
# The worker has no code of its own: it only hands the files to the visitor.

name = "portfolio"
compatibility_date = "2026-10-15"

# Branch (pull request) builds run `wrangler preview`, which refuses to run
# without this block. It can be empty: assets and compatibility stay above.
[previews]

[assets]
directory = "./dist"
not_found_handling = "404-page"
