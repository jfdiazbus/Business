<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The print shop — Juan Felipe Diaz Bustamante</title>
    <meta
      name="description"
      content="Scroll through the print shop: a paper world of websites, presentations and small tools, built by Juan Felipe Diaz Bustamante."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The print shop — Juan Felipe Diaz Bustamante" />
    <meta
      property="og:description"
      content="A paper world of websites, presentations and small tools."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='bold' text-anchor='middle' fill='%23ff6b5a'%3E:-)%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0a;
        --ink: #ffffff;
        --ink-soft: #a3a3a3;
        --line-strong: rgba(255, 255, 255, 0.16);
        --accent: #ff6b5a;
        --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* The engine draws the stage and its own bar. It takes the same colours
         the rest of the site uses, so the world matches without forking the
         vendored engine. */
      :root,
      .sw-root {
        --sw-bg: var(--bg);
        --sw-ink: var(--ink);
        --sw-ink-soft: var(--ink-soft);
        --sw-accent: var(--accent);
        --sw-font-display: var(--sans);
        --sw-font-body: var(--sans);
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }

      /* The engine lays its bar out with space-between, which pushes the nav to
         the far right. The parts read better at the beginning, beside the brand,
         and the row wraps rather than overflowing on a phone. */
      .sw-topbar {
        justify-content: flex-start;
        flex-wrap: wrap;
        row-gap: 10px;
      }

      /* the engine's chrome, retuned for a dark sheet */
      .sw-nav {
        background: color-mix(in srgb, #000 50%, transparent);
        border-color: var(--line-strong);
      }

      /* The engine paints the current scene white on the accent, which lands at
         2.8:1. Ink on the accent is 6.7:1 and still marks where you are. */
      .sw-nav__item.is-active {
        color: var(--bg);
      }

      .sw-route__label {
        background: color-mix(in srgb, #000 78%, transparent);
        color: var(--ink);
        border-color: var(--line-strong);
      }

      .sw-sky__glow {
        opacity: 0.3;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .no-js {
        max-width: 62ch;
        margin: 14vh auto;
        padding: 0 24px;
        line-height: 1.65;
      }

      .no-js h1,
      .no-js__title {
        font-size: 20px;
      }

      .no-js a {
        color: var(--accent);
      }

      /* The engine's copy block is centred on the left of the stage. Kept on the
         deck's scale and line lengths, and short enough not to run past the fold.
         These win over the engine's defaults, which live in @layer sw. */
      @media (min-width: 861px) {
        .sw-copy {
          width: min(38vw, 420px);
        }
      }

      .sw-copy__title {
        font-size: clamp(1.5rem, 2.9vw, 2.5rem);
        line-height: 1.12;
        max-width: 20ch;
        text-wrap: balance;
      }

      .sw-copy__body {
        font-size: clamp(0.95rem, 1.05vw, 1.06rem);
        max-width: 36ch;
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <div id="top"></div>
    <h1 class="sr-only">The print shop — Juan Felipe Diaz Bustamante</h1>
    <main>
      <div id="world"></div>
    </main>

    <noscript>
      <div class="no-js">
        <p class="no-js__title">Juan Felipe Diaz Bustamante — web developer</p>
        <p>
          The tour needs JavaScript to play. The five slide version has everything in it:
          <a href="/home">read the portfolio</a>.
        </p>
        <p>
          Or email me at
          <a href="mailto:jfdiazbus@gmail.com">jfdiazbus@gmail.com</a>.
        </p>
      </div>
    </noscript>

    <script src="/world/engine.js"></script>
    <script type="module" src="/world.js"></script>
  </body>
</html>
