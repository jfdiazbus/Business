server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/html text/css text/plain text/markdown application/javascript image/svg+xml;

  # a missing page gets the printed 404 instead of nginx's own
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # the client sites' assets never change once released
  location ~* ^/projects/[^/]+/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # the business plans read better as text than as a download
  location ~* \.md$ {
    default_type text/plain;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?|ttf)$ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    # /home finds home.html, the way the Workers asset server does
    try_files $uri $uri.html $uri/ =404;
  }
}
